name: Compilar recompiler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu / recompiler
    runs-on: ubuntu-latest

    steps:
      - name: Obter fontes e submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar
        run: >-
          cmake -S recompiler -B build/recompiler -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Compilar ferramentas públicas
        run: >-
          cmake --build build/recompiler --parallel
          --target psxrecomp-game psxrecomp-toml

      - name: Criar pacote ZIP
        run: |
          cd build/recompiler
          zip -j psxrecomp-ubuntu-latest.zip psxrecomp-game psxrecomp-toml

      - name: Publicar artefato ZIP
        uses: actions/upload-artifact@v4
        with:
          name: psxrecomp-ubuntu-latest-zip
          path: build/recompiler/psxrecomp-ubuntu-latest.zip

  release:
    name: Publicar Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Baixar artefatos compilados
        uses: actions/download-artifact@v4
        with:
          pattern: psxrecomp-ubuntu-latest-zip
          path: release
          merge-multiple: true

      - name: Criar ou Atualizar Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              release/psxrecomp-ubuntu-latest.zip \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          else
            gh release delete nightly -y || true
            git push --delete origin nightly || true
            
            gh release create nightly \
              release/psxrecomp-ubuntu-latest.zip \
              --title "Build Automática (Nightly)" \
              --notes "Versão compilada automaticamente a partir do último commit na branch main." \
              --target ${{ github.sha }} \
              --prerelease
          fi
